name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: ./init.sh --skip-install

      # init.sh summarizes each stage with only a short `tail` of its log and writes the full
      # output to /tmp, which is fine locally (the file is still on disk) but useless on a runner
      # whose filesystem is gone when the job ends. Dump every stage log so the check's own output
      # is sufficient both to diagnose a break (014 SC-004) and to read timings off a PASSING run
      # — a green run used to hide jest's per-suite durations entirely, which made
      # 015-ci-test-timeout's own timing criteria (SC-001/SC-004) unverifiable from CI. Runs with
      # `always()` rather than `failure()` for that reason. Each log is wrapped in a ::group:: so
      # it stays collapsed and costs a reader nothing unless they open it.
      - name: Dump init.sh stage logs
        if: always()
        run: |
          for log in /tmp/init-sh-front-*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done
